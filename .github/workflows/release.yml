name: Release

on:
  push:
    tags:
      - 'release-*'
    branches:
      - ci/github-actions

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build

    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-${{ runner.os }}-${{ runner.arch }}
          path: build/

      - name: Build with Nuitka
        uses: ./.github/actions/buildWithNuitka

      - name: install sxtr module
        run: |
          mkdir -p build/dist
          cp -r tracker/build/camera.dist* build/dist/



      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}-${{ runner.arch }}
          path: build/dist/
