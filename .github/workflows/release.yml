name: Release

on:
  push:
    tags:
      - 'release-*'
    branches:
      - ci/github-actions

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build

    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-${{ runner.os }}-${{ runner.arch }}
          path: build/


      - name: Build with Nuitka
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: tracker/camera.py
          mode: standalone
          output-dir: tracker/build
          user-package-configuration-file: tracker/mediapipe-tasks-c.nuitka-package.config.yml
          include-data-files: |
            tracker/models/pose_landmarker_full.task=models/pose_landmarker_full.task

      - name: install sxtr module
        run: |
          mkdir -p build/dist
          cp -r tracker/build/camera.dist* build/dist/



      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}-${{ runner.arch }}
          path: build/dist/
