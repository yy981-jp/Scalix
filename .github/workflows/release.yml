name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - develop
      - ci/github-actions

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      package: true

  verify:
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-24.04
          - macos-latest

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ runner.os }}-${{ runner.arch }}
          path: dist

      - name: Smoke-test Windows ZIP package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem -LiteralPath dist -Filter '*.zip' -File)
          if ($archives.Count -ne 1) {
            throw "Expected exactly one Windows ZIP package, found $($archives.Count)"
          }

          $extractDir = Join-Path $env:RUNNER_TEMP 'scalix-zip-smoke'
          if (Test-Path -LiteralPath $extractDir) {
            Remove-Item -LiteralPath $extractDir -Recurse -Force
          }
          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath $extractDir

          # CPack ZIP archives contain a versioned top-level directory.
          $executables = @(Get-ChildItem -LiteralPath $extractDir -Filter 'sl.exe' -File -Recurse |
            Where-Object { $_.Directory.Name -ieq 'bin' })
          if ($executables.Count -ne 1) {
            throw "Expected exactly one bin\sl.exe in the ZIP package, found $($executables.Count)"
          }
          $executable = $executables[0].FullName

          & $executable smoketest
          if ($LASTEXITCODE -ne 0) {
            throw "ZIP package smoke test failed with exit code $LASTEXITCODE"
          }

      - name: Smoke-test Windows NSIS installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath dist -Filter '*.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)"
          }

          $installDir = Join-Path $env:RUNNER_TEMP 'scalix-nsis-smoke'
          if (Test-Path -LiteralPath $installDir) {
            Remove-Item -LiteralPath $installDir -Recurse -Force
          }

          # NSIS requires /D= to be the final argument and not quoted.
          $install = Start-Process -FilePath $installers[0].FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "NSIS installation failed with exit code $($install.ExitCode)"
          }

          $executable = Join-Path $installDir 'bin\sl.exe'
          if (!(Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "NSIS installation is missing bin\sl.exe"
          }

          & $executable smoketest
          if ($LASTEXITCODE -ne 0) {
            throw "NSIS-installed executable smoke test failed with exit code $LASTEXITCODE"
          }

          $uninstaller = Join-Path $installDir 'Uninstall.exe'
          if (!(Test-Path -LiteralPath $uninstaller -PathType Leaf)) {
            throw "NSIS installation is missing Uninstall.exe"
          }

          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @('/S', "_?=$installDir") -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "NSIS uninstallation failed with exit code $($uninstall.ExitCode)"
          }

      - name: Smoke-test Linux packages in a clean Ubuntu container
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          # Use a fresh Ubuntu root filesystem instead of the preloaded GitHub
          # runner, whose packages can accidentally satisfy missing dependencies.
          docker run --rm --platform linux/amd64 \
            --volume "$GITHUB_WORKSPACE/dist:/dist:ro" \
            ubuntu:24.04 \
            bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive

              apt-get update
              # Test infrastructure only. Application runtime dependencies must
              # come from the DEB package metadata below.
              apt-get install --yes --no-install-recommends xvfb xauth

              shopt -s nullglob
              deb_packages=(/dist/*.deb)
              if [[ ${#deb_packages[@]} -ne 1 ]]; then
                echo "Expected exactly one Linux DEB package, found ${#deb_packages[@]}"
                exit 1
              fi

              apt-get install --yes --no-install-recommends "${deb_packages[0]}"

              # A clean package test must not accidentally resolve OpenCV from
              # the host image. Scalix must load its private copies from the DEB.
              if dpkg-query -W "libopencv*" >/dev/null 2>&1; then
                echo "Unexpected system OpenCV package installed in clean test container"
                dpkg-query -W "libopencv*"
                exit 1
              fi

              check_dependencies() {
                local binary="$1"
                local dependencies
                dependencies="$(ldd "$binary")"
                printf "%s\n" "$dependencies"
                if grep -Fq "not found" <<< "$dependencies"; then
                  echo "Unresolved shared-library dependency: $binary"
                  exit 1
                fi
              }

              deb_executable="/usr/bin/sl"
              if [[ ! -x "$deb_executable" ]]; then
                echo "Installed DEB package is missing /usr/bin/sl"
                exit 1
              fi
              check_dependencies "$deb_executable"

              tarballs=(/dist/*.tar.gz /dist/*.tgz)
              if [[ ${#tarballs[@]} -ne 1 ]]; then
                echo "Expected exactly one Linux TGZ package, found ${#tarballs[@]}"
                exit 1
              fi
              extract_dir="/tmp/scalix-tgz-smoke"
              mkdir -p "$extract_dir"
              tar -xzf "${tarballs[0]}" -C "$extract_dir"

              tgz_executable="$(find "$extract_dir" -type f -path "*/bin/sl" -print -quit)"
              if [[ -z "$tgz_executable" || ! -x "$tgz_executable" ]]; then
                echo "TGZ package is missing executable */bin/sl"
                exit 1
              fi
              check_dependencies "$tgz_executable"

              # Mesa software rendering is test infrastructure, installed only
              # after dependency resolution has been checked.
              apt-get install --yes --no-install-recommends libgl1-mesa-dri

              xvfb-run -a env -u LD_LIBRARY_PATH SDL_VIDEODRIVER=x11 LIBGL_ALWAYS_SOFTWARE=1 "$deb_executable" smoketest
              xvfb-run -a env -u LD_LIBRARY_PATH SDL_VIDEODRIVER=x11 LIBGL_ALWAYS_SOFTWARE=1 "$tgz_executable" smoketest
            '

      - name: Smoke-test macOS DMG package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          package="$(find dist -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          if [[ -z "$package" ]]; then
            echo "::error::macOS DMG package not found"
            exit 1
          fi

          mountpoint="$RUNNER_TEMP/scalix-dmg-smoke"
          mkdir -p "$mountpoint"
          hdiutil attach -readonly -nobrowse -mountpoint "$mountpoint" "$package"

          cleanup() {
            hdiutil detach "$mountpoint" -force >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          executable="$mountpoint/Scalix.app/Contents/MacOS/Scalix"
          if [[ ! -x "$executable" ]]; then
            echo "::error::DMG package is missing Scalix.app/Contents/MacOS/Scalix"
            exit 1
          fi

          if "$executable" smoketest; then
            exit 0
          else
            smoke_status=$?
            echo "::error::macOS smoketest exited with status $smoke_status; collecting a native backtrace."
            if command -v lldb >/dev/null 2>&1; then
              lldb --batch -o run -o "thread backtrace all" -- "$executable" smoketest || true
            elif command -v xcrun >/dev/null 2>&1; then
              xcrun lldb --batch -o run -o "thread backtrace all" -- "$executable" smoketest || true
            else
              echo "::warning::LLDB is unavailable on this runner."
            fi
            exit "$smoke_status"
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Calculate version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Scalix ${{ steps.version.outputs.version }}
          files: dist/*
