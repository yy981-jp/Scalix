name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'release-*'
    branches:
      - ci/github-actions


jobs:
  build:
    uses: ./.github/workflows/build.yml

  pack:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout assets
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init resources/assets


      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-${{ runner.os }}-${{ runner.arch }}
          path: build/

      - name: Build with Nuitka
        uses: ./.github/actions/buildWithNuitka

      - name: install sxtr module
        shell: bash
        run: |
          mkdir -p build/tracker
          cp -r tracker/build/camera.dist/* build/tracker/


      - name: Setup env
        uses: ./.github/actions/setupCENV

      - name: get submodules
        uses: ./.github/actions/getSubmodules

      - name: get external install
        uses: ./.github/actions/buildExternal

      # - name: Upload Debug artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: debug-${{ runner.os }}-${{ runner.arch }}
      #     path: .

      - name: Install NSIS
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" >> $GITHUB_PATH


      - name: Package
        working-directory: build
        shell: bash
        run: |
          cpack --config CPackConfig.cmake
          rm -rf dist/_CPack_Packages


      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}-${{ runner.arch }}
          path: build/dist/



  release:
    needs: pack
    runs-on: ubuntu-latest

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true



      - name: test Create release
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist


          
      - name: Calculate version
        if: startsWith(github.ref, 'refs/tags/release-')
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#release-}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/release-')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Scalix ${{ steps.version.outputs.version }}

