name: Release

on:
  push:
    tags:
      - 'release-*'
    branches:
      - ci/github-actions

jobs:
  build:
    uses: ./.github/workflows/build.yml

  pack:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout assets
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init resources/assets


      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-${{ runner.os }}-${{ runner.arch }}
          path: build/

      - name: Build with Nuitka
        uses: ./.github/actions/buildWithNuitka

      - name: install sxtr module
        shell: bash
        run: |
          mkdir -p build/dist
          cp -r tracker/build/camera.dist* build/dist/


      - name: Setup env
        uses: ./.github/actions/setupCENV

      - name: get external install
        uses: ./.github/actions/buildExternal

      - name: Package
        working-directory: build
        shell: bash
        run: |
          cpack --config CPackConfig.cmake
          rm -rf dist/_CPack_Packages


      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}-${{ runner.arch }}
          path: build/dist/



  release:
    needs: pack
    runs-on: ubuntu-latest

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      # - name: Create release
      #   uses: softprops/action-gh-release@v2
      #   with:
      #     files: dist/**/*

      - name: test Create release
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist
