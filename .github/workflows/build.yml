name: Build

on:
  workflow_call:
    inputs:
      package:
        description: Whether to create distributable packages after building.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build Project
        uses: ./.github/actions/buildProject

      - name: Install NSIS
        if: ${{ inputs.package && runner.os == 'Windows' }}
        run: |
          choco install nsis -y
          echo "C:\\Program Files (x86)\\NSIS" >> $GITHUB_PATH

      - name: Package
        if: ${{ inputs.package }}
        working-directory: build
        shell: bash
        run: |
          cpack --config CPackConfig.cmake
          rm -rf dist/_CPack_Packages

      - name: Upload build artifact
        if: ${{ !inputs.package }}
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ runner.os }}-${{ runner.arch }}
          path: build/
          retention-days: 3

      - name: Upload package artifact
        if: ${{ inputs.package }}
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}-${{ runner.arch }}
          path: build/dist/
          retention-days: 3
