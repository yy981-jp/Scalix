name: Release

on:
  push:
    tags:
      - 'release-*'

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build

    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Project
        uses: ./.github/actions/buildProject

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: scalix-${{ runner.os }}-${{ runner.arch }}
          path: build/
