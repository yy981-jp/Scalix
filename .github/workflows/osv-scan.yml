name: OSV vulnerability scan

on:
  push:
    branches:
      - main
      - develop
      - "security/**"
  pull_request:
    branches:
      - main
      - develop
  merge_group:
    branches:
      - main
      - develop
  schedule:
    - cron: "27 14 * * 1"
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to scan
        required: true
        type: choice
        options:
          - main
          - develop
        default: main

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan-current:
    name: Scan pinned dependencies on current ref
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.branch == 'main') }}
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.0
    with:
      # Include submodules so OSV-Scanner can inspect their pinned Git commits.
      checkout-submodules: true
      # Existing findings are uploaded for review without failing routine builds.
      fail-on-vuln: false
      ref: ${{ inputs.branch || github.ref_name }}
      scan-args: |-
        --recursive
        ./

  scan-develop:
    name: Scan develop and upload findings to develop
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.branch == 'develop') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop with submodules
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: develop
          submodules: true
          fetch-depth: 1

      - name: Run OSV-Scanner
        id: scan
        uses: google/osv-scanner-action/osv-scanner-action@v2.7.0
        continue-on-error: true
        with:
          scan-args: |-
            --recursive
            --format=sarif
            --output=results-develop.sarif
            ./

      - name: Verify scan output exists
        shell: bash
        run: |
          if [ ! -s results-develop.sarif ]; then
            echo "::error::OSV-Scanner did not produce results-develop.sarif. Check the scanner step for an execution or network error."
            exit 1
          fi

      - name: Upload findings against develop
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results-develop.sarif
          ref: refs/heads/develop
          sha: ${{ steps.checkout.outputs.commit }}
          category: osv-scanner-develop

  scan-pull-request:
    name: Check for newly introduced vulnerabilities
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.7.0
    with:
      checkout-submodules: true
      scan-args: |-
        --recursive
        ./
