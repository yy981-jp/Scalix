name: Build

on:
  push:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-protobuf
            mingw-w64-x86_64-yaml-cpp

      - name: Setup Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            ninja-build \
            libprotobuf-dev \
            protobuf-compiler \
            libyaml-cpp-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxss-dev \
            libxtst-dev \
            libwayland-dev \
            wayland-protocols \
            libdecor-0-dev \
            libgl-dev \
            libopengl-dev \
            libglx-dev \
            libegl1-mesa-dev \
            libdrm-dev \
            libgbm-dev \
            libpulse-dev \
            libasound2-dev \
            libusb-1.0-0-dev \
            libudev-dev \
            libunwind-dev \
            libfribidi-dev \
            libthai-dev \
            libprotobuf-dev
            
      - name: Setup CMake(Linux)
        if: runner.os == 'Linux'
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 4.1.2
          ninjaVersion: 1.13.2

      - name: Setup macOS
        if: runner.os == 'macOS'
        run: |
          brew install \
            cmake \
            ninja \
            protobuf \
            yaml-cpp

      - name: Build external
        uses: ./.github/actions/buildExternal

      - name: Configure
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        if: runner.os != 'Windows'
        run: |
          cmake --build build --parallel

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake --build build --parallel
