name: Get submodules
description: Get submodules

runs:
  using: composite

  steps:
    - name: Calculate submodule cache key
      id: submodule-key
      shell: bash
      run: |
        # Hash pinned external submodule commits, independent of initialization
        # state in other submodule paths such as assets.
        hash=$(
          git ls-tree HEAD:external |
            awk '$1 == "160000" { print $3, $4 }' |
            sort |
            sha256sum |
            cut -d' ' -f1
        )
        echo "key=submodules-depth1-external-${hash}" >> "$GITHUB_OUTPUT"

    - name: Restore submodule cache
      id: submodules
      uses: actions/cache/restore@v4
      with:
        path: external
        key: ${{ steps.submodule-key.outputs.key }}

    - name: Checkout submodules
      if: steps.submodules.outputs.cache-hit != 'true'
      shell: bash
      run: |
        git config --global url."https://github.com/".insteadOf "git@github.com:"
        git submodule update --init --recursive --depth 1

    - name: Save submodule cache
      if: steps.submodules.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: external
        key: ${{ steps.submodule-key.outputs.key }}
