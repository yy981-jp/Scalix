name: Build sxmp backend
description: Build the MediaPipe-based sxmp backend with MinGW

runs:
  using: composite

  steps:
    - name: Initialize MediaPipe submodule
      shell: bash
      run: |
        git submodule update --init --depth 1 sxmp/external/mediapipe

    - name: Fix zlib download URL
      shell: bash
      run: |
        workspace="sxmp/external/mediapipe/WORKSPACE"
        sed -i 's|http://zlib.net/fossils/zlib-1.2.13.tar.gz|https://zlib.net/fossils/zlib-1.2.13.tar.gz|' "$workspace"
        grep -F 'https://zlib.net/fossils/zlib-1.2.13.tar.gz' "$workspace"

    - name: Verify Python
      shell: msys2 {0}
      run: |
        command -v python3
        python3 --version

    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.19.1
      with:
        bazelisk-version: 1.29.0
        bazelisk-cache: true
        disk-cache: sxmp-backend-${{ runner.os }}-${{ runner.arch }}
        external-cache: true
        repository-cache: true
        module-root: sxmp/external/mediapipe

    - name: Build sxmp backend
      shell: msys2 {0}
      working-directory: sxmp/external/mediapipe
      env:
        USE_BAZEL_VERSION: 7.4.1
      run: |
        BAZEL="$(cygpath -u "$RUNNER_TOOL_CACHE")/bazelisk/1.29.0/x64/bazel.exe"
        if [[ ! -x "$BAZEL" ]]; then
          echo "::error::Bazelisk executable not found: $BAZEL"
          exit 1
        fi
        "$BAZEL" build \
          -c opt \
          --copt=-O3 \
          --copt=-fomit-frame-pointer \
          --copt=-ffunction-sections \
          --copt=-fdata-sections \
          --linkopt=-Wl,--gc-sections \
          --crosstool_top=//third_party/mingw_cc_toolchain:toolchain \
          --cpu=x64_windows \
          --compiler=mingw-gcc \
          --define MEDIAPIPE_DISABLE_GPU=1 \
          --repo_env=HERMETIC_PYTHON_VERSION=3.12 \
          --copt=-DHAVE_PTHREAD \
          --host_copt=-DHAVE_PTHREAD \
          --copt=-D_WIN32_WINNT=0x0601 \
          --host_copt=-D_WIN32_WINNT=0x0601 \
          --copt=-fno-canonical-system-headers \
          --reuse_sandbox_directories \
          @sxmp//:sxmp_be_import_lib
