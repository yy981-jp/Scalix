name: Build sxmp backend
description: Build the MediaPipe-based sxmp backend against Scalix-owned OpenCV.

runs:
  using: composite

  steps:
    - name: Initialize MediaPipe submodule
      shell: bash
      run: |
        git submodule update --init --depth 1 sxmp/external/mediapipe

    - name: Verify zlib macOS compatibility patch
      if: runner.os == 'macOS'
      shell: bash
      run: |
        patch="sxmp/external/mediapipe/third_party/zlib.diff"
        if ! grep -Fq '+#if defined(MACOS)' "$patch"; then
          echo "::error::MediaPipe zlib patch is missing the macOS compatibility fix."
          exit 1
        fi

    - name: Fix zlib download URL (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        workspace="sxmp/external/mediapipe/WORKSPACE"
        sed -i 's|http://zlib.net/fossils/zlib-1.2.13.tar.gz|https://zlib.net/fossils/zlib-1.2.13.tar.gz|' "$workspace"
        grep -F 'https://zlib.net/fossils/zlib-1.2.13.tar.gz' "$workspace"

    - name: Fix zlib download URL (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        python3 - <<'PY'
        from pathlib import Path

        workspace = Path("sxmp/external/mediapipe/WORKSPACE")
        old = "http://zlib.net/fossils/zlib-1.2.13.tar.gz"
        new = "https://zlib.net/fossils/zlib-1.2.13.tar.gz"
        content = workspace.read_text()
        if old in content:
            workspace.write_text(content.replace(old, new))
        elif new not in content:
            raise SystemExit(f"Could not find the expected zlib URL in {workspace}")
        print(f"Using {new}")
        PY

    - name: Verify Python (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: |
        command -v python3
        python3 --version

    - name: Verify Python (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        command -v python3
        python3 --version

    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.19.1
      with:
        bazelisk-version: 1.29.0
        bazelisk-cache: true
        disk-cache: sxmp-backend-${{ runner.os }}-${{ runner.arch }}
        # Rotate Windows caches because the initial failed run saved an empty cache.
        cache-version: ${{ runner.os == 'Windows' && '2' || '1' }}
        # Temporarily enable this on Windows to measure the impact on CI time.
        # Revert if restoring extracted repositories brings back absolute-path include errors.
        external-cache: true
        repository-cache: true
        module-root: sxmp/external/mediapipe

    - name: Build sxmp backend (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      working-directory: sxmp/external/mediapipe
      env:
        USE_BAZEL_VERSION: 7.4.1
      run: |
        BAZEL="$(cygpath -u "$RUNNER_TOOL_CACHE")/bazelisk/1.29.0/x64/bazel.exe"
        if [[ ! -x "$BAZEL" ]]; then
          echo "::error::Bazelisk executable not found: $BAZEL"
          exit 1
        fi

        # setup-bazel's disk/repository cache paths are on D: for hosted Windows.
        # Pass these paths directly because MSYS2 may use a different HOME than
        # the setup-bazel action that writes the user .bazelrc.
        DISK_CACHE="D:/_bazel-disk"
        REPOSITORY_CACHE="D:/_bazel-repo"
        mkdir -p "$(cygpath -u "$DISK_CACHE")" \
          "$(cygpath -u "$REPOSITORY_CACHE")"

        "$BAZEL" \
          build \
          --announce_rc \
          --disk_cache="$DISK_CACHE" \
          --repository_cache="$REPOSITORY_CACHE" \
          -c opt \
          --copt=-O3 \
          --copt=-fomit-frame-pointer \
          --copt=-ffunction-sections \
          --copt=-fdata-sections \
          --linkopt=-Wl,--gc-sections \
          --crosstool_top=//third_party/mingw_cc_toolchain:toolchain \
          --cpu=x64_windows \
          --compiler=mingw-gcc \
          --define MEDIAPIPE_DISABLE_GPU=1 \
          --repo_env=HERMETIC_PYTHON_VERSION=3.12 \
          --copt=-DHAVE_PTHREAD \
          --host_copt=-DHAVE_PTHREAD \
          --copt=-D_WIN32_WINNT=0x0601 \
          --host_copt=-D_WIN32_WINNT=0x0601 \
          --copt=-fno-canonical-system-headers \
          --reuse_sandbox_directories \
          @sxmp//:sxmp_be \
          @sxmp//:sxmp_be_import_lib

    - name: Verify sxmp backend runtime DLL (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      working-directory: sxmp/external/mediapipe
      run: |
        expected="bazel-bin/external/sxmp/libsxmp_be.dll"

        # Prefer Bazel's public output path. The bazel-out directory is often a
        # symlink on Windows, so a plain find does not necessarily descend into it.
        if [[ -f "$expected" ]]; then
          echo "Using runtime DLL: $expected"
          exit 0
        fi

        runtime_dll="$(find -L bazel-out bazel-bin -iname 'libsxmp_be.dll' -type f -print -quit 2>/dev/null || true)"
        if [[ -z "$runtime_dll" ]]; then
          echo "::error::Bazel finished without producing libsxmp_be.dll."
          echo "Bazel's declared output files:"
          BAZEL="$(cygpath -u "$RUNNER_TOOL_CACHE")/bazelisk/1.29.0/x64/bazel.exe"
          "$BAZEL" cquery --output=files @sxmp//:sxmp_be || true
          echo "Available sxmp backend outputs:"
          find -L bazel-out bazel-bin -iname '*sxmp_be*' -print 2>/dev/null | head -n 100
          exit 1
        fi

        mkdir -p "$(dirname "$expected")"
        if [[ ! -e "$expected" || ! "$runtime_dll" -ef "$expected" ]]; then
          cp -f "$runtime_dll" "$expected"
        fi
        test -f "$expected"
        echo "Using runtime DLL: $expected"

    - name: Build sxmp backend (Linux and macOS)
      if: runner.os != 'Windows'
      shell: bash
      working-directory: sxmp/external/mediapipe
      env:
        USE_BAZEL_VERSION: 7.4.1
      run: |
        LINK_GC_ARGS=()
        if [[ "$RUNNER_OS" == "Linux" ]]; then
          LINK_GC_ARGS+=(--linkopt=-Wl,--gc-sections)
        fi

        bazel build \
          -c opt \
          --copt=-O3 \
          --copt=-fomit-frame-pointer \
          --copt=-ffunction-sections \
          --copt=-fdata-sections \
          "${LINK_GC_ARGS[@]}" \
          --define MEDIAPIPE_DISABLE_GPU=1 \
          --repo_env=HERMETIC_PYTHON_VERSION=3.12 \
          --reuse_sandbox_directories \
          @sxmp//:sxmp_be

    - name: Verify sxmp backend runtime library (Linux and macOS)
      if: runner.os != 'Windows'
      shell: bash
      working-directory: sxmp/external/mediapipe
      env:
        USE_BAZEL_VERSION: 7.4.1
      run: |
        case "$RUNNER_OS" in
          Linux) suffix=so ;;
          macOS) suffix=dylib ;;
          *)
            echo "::error::Unsupported sxmp backend runtime platform: $RUNNER_OS"
            exit 1
            ;;
        esac

        expected="bazel-bin/external/sxmp/libsxmp_be.$suffix"
        if [[ -f "$expected" ]]; then
          echo "Using runtime library: $expected"
          exit 0
        fi

        runtime_library="$(find -L bazel-out bazel-bin -iname "libsxmp_be.$suffix" -type f -print -quit 2>/dev/null || true)"
        if [[ -z "$runtime_library" ]]; then
          echo "::error::Bazel finished without producing libsxmp_be.$suffix."
          echo "Bazel's declared output files:"
          bazel cquery --output=files @sxmp//:sxmp_be || true
          echo "Available sxmp backend outputs:"
          find -L bazel-out bazel-bin -iname '*sxmp_be*' -print 2>/dev/null | head -n 100
          exit 1
        fi

        mkdir -p "$(dirname "$expected")"
        if [[ ! -e "$expected" || ! "$runtime_library" -ef "$expected" ]]; then
          cp -f "$runtime_library" "$expected"
        fi
        test -f "$expected"
        echo "Using runtime library: $expected"
