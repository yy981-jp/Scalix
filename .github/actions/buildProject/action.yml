name: Build Project
description: Build Project

runs:
  using: composite

  steps:
    - name: Prepare build
      uses: ./.github/actions/prepareBuild

    - name: Build sxmp backend
      uses: ./.github/actions/buildSxmpBackend

    - name: Configure
      shell: bash
      run: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

    - name: Build
      shell: bash
      run: |
        cmake --build build --parallel
