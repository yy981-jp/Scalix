name: Build Project

runs:
  using: composite
  
  steps:
    - name: Calculate submodule cache key
      id: submodule-key
      shell: bash
      run: |
        hash=$(git submodule status | sha256sum | cut -d' ' -f1)
        echo "key=submodules-${hash}" >> "$GITHUB_OUTPUT"

    - name: Restore submodule cache
      id: submodules
      uses: actions/cache/restore@v4
      with:
        path: external
        key: ${{ steps.submodule-key.outputs.key }}

    - name: Checkout submodules
      if: steps.submodules.outputs.cache-hit != 'true'
      shell: bash
      run: |
        git config --global url."https://github.com/".insteadOf "git@github.com:"
        git submodule update --init --recursive

    - name: Save submodule cache
      if: steps.submodules.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: external
        key: ${{ steps.submodule-key.outputs.key }}
        
    - name: Checkout assets
      shell: bash
      run: |
        git config --global url."https://github.com/".insteadOf "git@github.com:"
        git submodule update --init resources/assets


    - name: Setup env
      uses: ./.github/actions/setupCENV


    - name: Build external
      uses: ./.github/actions/buildExternal
    
    - name: Configure
      if: runner.os != 'Windows'
      shell: bash
      run: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

    - name: Configure Windows
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

    - name: Build
      if: runner.os != 'Windows'
      shell: bash
      run: |
        cmake --build build --parallel

    - name: Build Windows
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: |
        cmake --build build --parallel
