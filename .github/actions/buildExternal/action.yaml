name: Build External

runs:
  using: composite

  steps:
    - name: Calculate cache key
      id: external-key
      shell: bash
      run: |
        hash=$(
          {
            git -C external/bgfx rev-parse HEAD
            git -C external/bx rev-parse HEAD
            git -C external/bimg rev-parse HEAD
            git -C external/bgfx.cmake rev-parse HEAD
            git -C external/SDL rev-parse HEAD
            git -C external/SDL-image rev-parse HEAD
            sha256sum external/CMakeLists.txt
          } | sha256sum | cut -d ' ' -f1
        )
        key="bgfx-${{ runner.os }}-${{ runner.arch }}-${hash}"
        echo "key=$key" >> "$GITHUB_OUTPUT"


    - name: Restore bgfx cache
      id: bgfx-cache
      uses: actions/cache/restore@v4
      with:
        path: external/install/release
        key: ${{ steps.external-key.outputs.key }}

    - name: Build external (Windows)
      if: steps.bgfx-cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
      shell: msys2 {0}
      run: |
        cmake -S external -B external/build -G Ninja
        cmake --build external/build --parallel

    - name: Build external (Unix)
      if: steps.bgfx-cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
      shell: bash
      run: |
        cmake -S external -B external/build -G Ninja
        cmake --build external/build --parallel

    - name: Save bgfx cache
      if: steps.bgfx-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: external/install/release
        key: ${{ steps.external-key.outputs.key }}
